<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bola Flix — مكتبتك، بلا حدود</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  /* ---------- Navbar ---------- */
  .navbar {
    position: fixed; top: 0; right: 0; left: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 5%;
    transition: background .3s ease, padding .3s ease, backdrop-filter .3s ease;
  }
  .navbar.scrolled {
    background: rgba(10,9,12,0.92);
    backdrop-filter: blur(10px);
    padding: 12px 5%;
    border-bottom: 1px solid var(--border-soft);
  }
  .nav-left { display: flex; align-items: center; gap: 34px; }
  .nav-links { display: flex; gap: 24px; list-style: none; }
  .nav-links a {
    font-size: .92rem; color: var(--text-muted); font-weight: 500;
    transition: color .15s ease; position: relative;
  }
  .nav-links a.active, .nav-links a:hover { color: var(--text-primary); }
  .nav-right { display: flex; align-items: center; gap: 18px; }
  .search-wrap { position: relative; }
  .search-input {
    width: 0; opacity: 0; padding: 9px 0;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-radius: 5px;
    font-family: inherit;
    transition: width .3s ease, opacity .3s ease, padding .3s ease;
  }
  .search-input.open { width: 220px; opacity: 1; padding: 9px 14px; }
  .icon-btn {
    background: none; color: var(--text-primary); font-size: 1.15rem;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent-ember), var(--accent-gold));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: .85rem; color: #1a0a10;
  }
  .user-menu { position: relative; }
  .user-dropdown {
    position: absolute; left: 0; top: 46px;
    background: var(--bg-surface); border: 1px solid var(--border-soft);
    border-radius: 8px; min-width: 170px; padding: 8px;
    display: none; box-shadow: var(--shadow-deep);
  }
  .user-dropdown.open { display: block; animation: dropIn .18s ease; }
  @keyframes dropIn { from { opacity:0; transform: translateY(-6px);} to {opacity:1; transform:translateY(0);} }
  .user-dropdown button {
    width: 100%; text-align: right; background: none; color: var(--text-primary);
    padding: 9px 10px; border-radius: 5px; font-size: .88rem;
  }
  .user-dropdown button:hover { background: var(--bg-elevated); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 92vh;
    min-height: 560px;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: top center;
    transform: scale(1.06);
    animation: heroZoom 18s ease-in-out infinite alternate;
  }
  @keyframes heroZoom { from { transform: scale(1.0); } to { transform: scale(1.08); } }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(to top, var(--bg-void) 2%, rgba(10,9,12,0.15) 45%, transparent 75%),
      linear-gradient(to left, rgba(10,9,12,0.05), var(--bg-void) 100%);
  }
  .hero-content {
    position: relative; z-index: 3;
    padding: 0 5% 7%;
    max-width: 640px;
    animation: heroIn 1s cubic-bezier(.16,1,.3,1);
  }
  @keyframes heroIn { from { opacity:0; transform: translateY(24px);} to {opacity:1; transform:translateY(0);} }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent-gold); font-size: .82rem; font-weight: 700;
    margin-bottom: 14px; letter-spacing: .3px;
  }
  .hero-title {
    font-size: clamp(2.2rem, 5vw, 4rem);
    font-weight: 900; line-height: 1.05; margin-bottom: 16px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .hero-meta {
    display: flex; align-items: center; gap: 14px;
    color: var(--text-muted); font-size: .9rem; margin-bottom: 16px;
  }
  .hero-meta .rating { color: var(--accent-gold); font-weight: 700; }
  .hero-desc {
    color: #D8D3D9; font-size: .98rem; line-height: 1.75;
    margin-bottom: 26px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hero-actions { display: flex; gap: 14px; }
  .play-btn { font-size: 1rem; padding: 14px 34px; }
  .play-btn svg { width: 18px; height: 18px; }

  /* ---------- Rows ---------- */
  .rows { position: relative; z-index: 2; margin-top: -8vh; padding-bottom: 60px; }
  .row-section {
    margin-bottom: 40px;
    opacity: 0; transform: translateY(26px);
    transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
  }
  .row-section.in-view { opacity: 1; transform: translateY(0); }
  .card { opacity: 0; transform: translateY(14px) scale(.96); }
  .row-section.in-view .card {
    opacity: 1; transform: translateY(0) scale(1);
    transition: opacity .5s ease, transform .5s ease;
  }
  .row-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 5%; margin-bottom: 14px;
  }
  .row-title { font-size: 1.25rem; font-weight: 800; }
  .row-count { color: var(--text-muted); font-size: .82rem; }

  .row-track {
    display: flex; gap: 12px; overflow-x: auto; padding: 6px 5% 26px;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .row-track::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 auto; width: 190px; cursor: pointer;
    border-radius: 10px; overflow: hidden;
    background: var(--bg-surface);
    position: relative;
  }
  .card-img-wrap {
    position: relative; width: 100%; aspect-ratio: 2/3;
    background: var(--bg-elevated); overflow: hidden;
    border-radius: 10px;
  }
  .card-img-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .card-poster {
    opacity: 1;
    transition: opacity .3s ease;
  }
  .card-backdrop {
    opacity: 0;
    transition: opacity .3s ease;
  }
  .card:hover .card-poster { opacity: 0; }
  .card:hover .card-backdrop { opacity: 1; }

  .card-play-icon {
    position: absolute; top: 50%; left: 50%;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(10,9,12,0.55); backdrop-filter: blur(3px);
    border: 2px solid rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.1rem;
    opacity: 0; transform: translate(-50%,-50%) scale(.6);
    transition: opacity .3s ease .08s, transform .3s cubic-bezier(.34,1.56,.64,1) .08s;
    pointer-events: none;
  }
  .card:hover .card-play-icon { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  .card-rating {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: rgba(10,9,12,0.75); backdrop-filter: blur(4px);
    color: var(--accent-gold); font-size: .72rem; font-weight: 800;
    padding: 3px 7px; border-radius: 4px;
  }
  .card-overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(to top, rgba(6,5,7,0.98) 5%, transparent 62%);
    opacity: 0; transition: opacity .3s ease;
    display: flex; align-items: flex-end; padding: 12px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay-title {
    font-size: .84rem; font-weight: 800; line-height: 1.3;
  }

  .card-rank-ribbon {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    background: var(--accent-ember); color: #fff;
    font-size: .7rem; font-weight: 900; line-height: 1;
    padding: 6px 8px; border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; align-items: center;
  }
  .card-rank-ribbon .rank-top { font-size: .55rem; letter-spacing: .5px; }
  .card-rank-ribbon .rank-num { font-size: 1rem; }

  /* ---------- Floating Netflix-style hover preview (a real box, not a stretched panel) ---------- */
  .hover-preview {
    position: fixed; z-index: 200; width: 300px;
    background: var(--bg-surface, #17141a);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 0 1.5px var(--accent-ember);
    opacity: 0; visibility: hidden; transform: scale(.86);
    transform-origin: center center;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    pointer-events: none;
  }
  .hover-preview.show { opacity: 1; visibility: visible; transform: scale(1); pointer-events: auto; }
  .hp-media { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .hp-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hp-media::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 55%);
  }
  .hp-play-icon {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(10,9,12,0.55); backdrop-filter: blur(3px);
    border: 2px solid rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.05rem; cursor: pointer;
  }
  .hp-body { padding: 12px 14px 14px; }
  .hp-actions { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .hp-icon-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff; font-size: .85rem;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
    flex-shrink: 0;
  }
  .hp-icon-btn:hover { border-color: #fff; transform: scale(1.08); }
  .hp-icon-btn.is-active { color: var(--accent-ember); border-color: var(--accent-ember); }
  .hp-play-btn {
    flex: 1; height: 30px; border-radius: 15px;
    background: #fff; color: #111; font-weight: 800; font-size: .8rem;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: background .15s ease, transform .15s ease;
  }
  .hp-play-btn:hover { background: #e3e3e3; transform: scale(1.03); }
  .hp-play-btn svg { width: 13px; height: 13px; }
  .hp-title {
    font-size: .95rem; font-weight: 800; margin-bottom: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hp-badge {
    display: flex; align-items: center; gap: 5px;
    color: #8fd3f4; font-size: .72rem; font-weight: 700; margin-bottom: 6px;
  }
  .hp-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #4fc3f7; flex-shrink: 0;
  }
  .hp-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--text-muted); font-size: .72rem; }
  .hp-meta span:not(:last-child)::after { content: '•'; margin-right: 6px; opacity: .6; }

  .card-progress {
    position: absolute; bottom: 0; right: 0; left: 0; height: 4px;
    background: rgba(255,255,255,0.15); z-index: 3;
  }
  .card-progress-fill { height: 100%; background: var(--accent-ember); }

  .card-skeleton {
    background: linear-gradient(100deg, var(--bg-surface) 30%, var(--bg-elevated) 50%, var(--bg-surface) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0;} to { background-position: -200% 0;} }

  /* ---------- States ---------- */
  .empty-state {
    text-align: center; padding: 120px 20px;
  }
  .empty-state h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .empty-state p { color: var(--text-muted); margin-bottom: 22px; }

  /* ---------- Footer ---------- */
  .footer {
    position: relative; z-index: 2;
    padding: 40px 5%; border-top: 1px solid var(--border-soft);
    color: var(--text-muted); font-size: .82rem;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .card { width: 128px; }
    .hero { height: 78vh; }
    .modal-hero-title { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="projector-beam"></div>
<div class="film-grain"></div>

<!-- ===== Navbar ===== -->
<nav class="navbar" id="navbar">
  <div class="nav-left">
    <span class="logo">Bola<span class="accent">Flix</span></span>
    <ul class="nav-links">

        <a href="profile.html" style="display:block;text-align:right;padding:9px 10px;border-radius:5px;font-size:.88rem;">البروفايل</a>

      </div>

</nav>

<!-- ===== Hero ===== -->
<header class="hero" id="hero" style="display:none;">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <div class="hero-badge">★ ترشيح Bola Flix</div>
    <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>

      </button>
      <button class="btn btn-ghost play-btn" id="heroInfoBtn">تفاصيل أكتر</button>

<main class="rows" id="rows"></main>

        تشغيل
      </button>

  <h2>المكتبة فاضية دلوقتي</h2>
  <p>اتأكد إن سيرفر Jellyfin شغال وفيه محتوى متاح لحسابك.</p>
</div>

<footer class="footer">
  <span>Bola Flix — منصة خاصة متصلة بمكتبتك الشخصية</span>
  <span id="itemCountFooter"></span>
</footer>

<script>
const server = BF_CONFIG.SERVER_URL;
const token = localStorage.getItem('bf_token');
const userId = localStorage.getItem('bf_userId');
const username = localStorage.getItem('bf_username');

if (!server || !token || !userId) window.location.href = 'login.html';

document.getElementById('userNameDisplay').textContent = username || '';
document.getElementById('avatarBtn').textContent = (username || '?').trim().charAt(0).toUpperCase();

function imgUrl(id, type='Primary', tag='') {
  return `${server}/Items/${id}/Images/${type}?quality=90${tag ? '&tag='+tag : ''}`;
}

let allItems = [];

async function fetchLibrary() {
  const url = `${server}/Users/${userId}/Items?IncludeItemTypes=Movie,Series&Recursive=true&Fields=Overview,Genres,CommunityRating,ProductionYear,BackdropImageTags,UserData,RunTimeTicks&SortBy=DateCreated&SortOrder=Descending&Limit=400`;
  const res = await fetch(url, { headers: { 'X-Emby-Token': token } });
  if (!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  return data.Items || [];
}

function toggleFavorite(itemId, btn) {
  const item = allItems.find(i => i.Id === itemId);
  const isFav = item.UserData && item.UserData.IsFavorite;
  const method = isFav ? 'DELETE' : 'POST';
  fetch(`${server}/Users/${userId}/FavoriteItems/${itemId}`, { method, headers: { 'X-Emby-Token': token } })
    .then(() => {
      if (!item.UserData) item.UserData = {};
      item.UserData.IsFavorite = !isFav;
      btn.classList.toggle('is-active', item.UserData.IsFavorite);
      btn.textContent = item.UserData.IsFavorite ? '♥' : '♡';
    }).catch(() => {});
}

function shareItem(item) {
  const url = `${window.location.origin}${window.location.pathname.replace('index.html','')}details.html?id=${item.Id}`;
  if (navigator.share) {
    navigator.share({ title: item.Name, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(url);
  }
}

function buildCard(item, rank) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = item.Id;
  const rating = item.CommunityRating ? item.CommunityRating.toFixed(1) : '—';
  const backdropTag = item.BackdropImageTags && item.BackdropImageTags[0];
  const backdropSrc = backdropTag ? imgUrl(item.Id, 'Backdrop', backdropTag) : imgUrl(item.Id);

  let progressBar = '';
  const pos = item.UserData && item.UserData.PlaybackPositionTicks;
  if (pos && item.RunTimeTicks) {
    const pct = Math.min(100, Math.round((pos / item.RunTimeTicks) * 100));
    progressBar = `<div class="card-progress"><div class="card-progress-fill" style="width:${pct}%"></div></div>`;
  }

  el.innerHTML = `
    <div class="card-img-wrap">
      ${rank ? `<div class="card-rank-ribbon"><span class="rank-top">TOP</span><span class="rank-num">${rank}</span></div>` : ''}
      <img class="card-poster" src="${imgUrl(item.Id)}" alt="${item.Name}" loading="lazy" onerror="this.style.opacity=0">
      <img class="card-backdrop" src="${backdropSrc}" alt="" loading="lazy">
      <span class="card-rating">★ ${rating}</span>
      <div class="card-play-icon">▶</div>
      <div class="card-overlay"><span class="card-overlay-title">${item.Name}</span></div>
      ${progressBar}
    </div>
  `;

  let hoverTimer;
  el.addEventListener('mouseenter', () => {
    clearTimeout(hidePreviewTimer);
    hoverTimer = setTimeout(() => showHoverPreview(item, el, rank, backdropSrc), 380);
  });
  el.addEventListener('mouseleave', () => {
    clearTimeout(hoverTimer);
    hidePreviewTimer = setTimeout(hideHoverPreview, 150);
  });

  el.addEventListener('click', () => window.location.href = `details.html?id=${item.Id}`);
  return el;
}

// ---------- Floating Netflix-style hover preview ----------
const hoverPreview = document.getElementById('hoverPreview');
let hidePreviewTimer;
let currentPreviewItem = null;

hoverPreview.addEventListener('mouseenter', () => clearTimeout(hidePreviewTimer));
hoverPreview.addEventListener('mouseleave', () => {
  hidePreviewTimer = setTimeout(hideHoverPreview, 150);
});

function showHoverPreview(item, cardEl, rank, backdropSrc) {
  const wasShown = hoverPreview.classList.contains('show');
  const switchingItem = wasShown && currentPreviewItem && currentPreviewItem.Id !== item.Id;

  const applyContent = () => {
    currentPreviewItem = item;
    document.getElementById('hpBackdrop').src = backdropSrc;
    document.getElementById('hpTitle').textContent = item.Name;

    const typeLabel = item.Type === 'Series' ? 'مسلسل' : 'فيلم';
    const seasonLabel = item.Type === 'Series' && item.ChildCount ? `الموسم ${item.ChildCount}` : null;
    const metaParts = [item.ProductionYear, seasonLabel, typeLabel, ...(item.Genres || []).slice(0,2)].filter(Boolean);
    document.getElementById('hpMeta').innerHTML = metaParts.map(m => `<span>${m}</span>`).join('');

    const rankEl = document.getElementById('hpRank');
    if (rank) { rankEl.style.display = 'flex'; rankEl.querySelector('.rank-num').textContent = rank; }
    else { rankEl.style.display = 'none'; }

    const isFav = item.UserData && item.UserData.IsFavorite;
    const favBtn = document.getElementById('hpFav');
    favBtn.classList.toggle('is-active', !!isFav);
    favBtn.textContent = isFav ? '♥' : '♡';

    // ---- التموضع فوق مكان الكارت بالظبط (صندوق عائم، مش شريط بيطول) ----
    const rect = cardEl.getBoundingClientRect();
    const pw = 300, ph = 300;
    let left = rect.left + rect.width / 2 - pw / 2;
    left = Math.max(10, Math.min(left, window.innerWidth - pw - 10));
    let top = rect.top + rect.height / 2 - ph / 2;
    top = Math.max(10, Math.min(top, window.innerHeight - ph - 10));

    hoverPreview.style.left = `${left}px`;
    hoverPreview.style.top = `${top}px`;
    hoverPreview.classList.add('show');
  };

  if (switchingItem) {
    // بنقفل بأنيميشن الأول قبل ما نفتح على الكارت التاني، عشان ميحصلش قفز فجأة
    hoverPreview.classList.remove('show');
    setTimeout(applyContent, 140);
  } else {
    applyContent();
  }
}

function hideHoverPreview() {
  hoverPreview.classList.remove('show');
  currentPreviewItem = null;
}

document.getElementById('hpFav').addEventListener('click', () => {
  if (!currentPreviewItem) return;
  toggleFavorite(currentPreviewItem.Id, document.getElementById('hpFav'));
});
document.getElementById('hpShare').addEventListener('click', () => {
  if (currentPreviewItem) shareItem(currentPreviewItem);
});
document.getElementById('hpAdd').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  btn.textContent = '✓';
  setTimeout(() => btn.textContent = '+', 1500);
});
document.getElementById('hpPlayBtn').addEventListener('click', () => {
  if (currentPreviewItem) window.location.href = `details.html?id=${currentPreviewItem.Id}`;
});
document.getElementById('hpPlayIcon').addEventListener('click', () => {
  if (currentPreviewItem) window.location.href = `details.html?id=${currentPreviewItem.Id}`;
});
window.addEventListener('scroll', hideHoverPreview, { passive: true });

function buildRow(title, items, showRank) {
  if (!items.length) return null;
  const section = document.createElement('section');
  section.className = 'row-section';
  section.innerHTML = `
    <div class="row-head">
      <span class="row-title">${title}</span>
      <span class="row-count">${items.length} عنصر</span>
    </div>
    <div class="row-track"></div>
  `;
  const track = section.querySelector('.row-track');
  items.forEach((item, idx) => track.appendChild(buildCard(item, showRank ? idx + 1 : null)));
  return section;
}

function groupByGenre(items) {
  const map = {};
  items.forEach(item => {
    (item.Genres || ['أخرى']).forEach(g => {
      if (!map[g]) map[g] = [];
      map[g].push(item);
    });
  });
  return map;
}

function renderRows(items) {
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';

  const continueWatching = items.filter(i => i.UserData && i.UserData.PlaybackPositionTicks > 0 && !i.UserData.Played);
  const cwRow = buildRow('أكمل المشاهدة', continueWatching);
  if (cwRow) rowsEl.appendChild(cwRow);

  const recent = items.slice(0, 20);
  const recentRow = buildRow('أضيف حديثًا', recent);
  if (recentRow) rowsEl.appendChild(recentRow);

  const topRated = [...items].filter(i => i.CommunityRating).sort((a,b) => b.CommunityRating - a.CommunityRating).slice(0, 20);
  const topRow = buildRow('الأعلى تقييمًا', topRated, true);
  if (topRow) rowsEl.appendChild(topRow);

  const byGenre = groupByGenre(items);
  Object.keys(byGenre).slice(0, 8).forEach(genre => {
    const row = buildRow(genre, byGenre[genre].slice(0, 20));
    if (row) rowsEl.appendChild(row);
  });

  document.getElementById('itemCountFooter').textContent = `${items.length} عمل متاح في مكتبتك`;
  observeRows();
}

const rowObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      rowObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });

function observeRows() {
  document.querySelectorAll('.row-section:not(.in-view)').forEach(row => rowObserver.observe(row));
}

function setHero(item) {
  const hero = document.getElementById('hero');
  hero.style.display = 'flex';
  const backdropTag = item.BackdropImageTags && item.BackdropImageTags[0];
  const bgUrl = backdropTag ? imgUrl(item.Id, 'Backdrop') : imgUrl(item.Id);
  document.getElementById('heroBg').style.backgroundImage = `url('${bgUrl}')`;
  document.getElementById('heroTitle').textContent = item.Name;
  document.getElementById('heroDesc').textContent = item.Overview || 'لا يوجد وصف متاح لهذا العمل حاليًا.';
  const metaEl = document.getElementById('heroMeta');
  metaEl.innerHTML = `
    ${item.CommunityRating ? `<span class="rating">★ ${item.CommunityRating.toFixed(1)}</span>` : ''}
    <span>${item.ProductionYear || ''}</span>
    <span>${(item.Genres || []).slice(0,3).join(' · ')}</span>
  `;
  document.getElementById('heroPlayBtn').onclick = () => window.location.href = `player.html?id=${item.Id}`;
  document.getElementById('heroInfoBtn').onclick = () => window.location.href = `details.html?id=${item.Id}`;
}

// ---------- Navbar behaviour ----------
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
});

document.getElementById('searchToggle').addEventListener('click', () => {
  const input = document.getElementById('searchInput');
  input.classList.toggle('open');
  if (input.classList.contains('open')) input.focus();
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderRows(allItems); return; }
  const filtered = allItems.filter(i => i.Name.toLowerCase().includes(q));
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  const row = buildRow(`نتائج البحث عن "${e.target.value}"`, filtered);
  if (row) rowsEl.appendChild(row);
  else rowsEl.innerHTML = `<div class="empty-state"><h2>مفيش نتائج</h2><p>جرب كلمة تانية</p></div>`;
});

document.getElementById('avatarBtn').addEventListener('click', () => {
  document.getElementById('userDropdown').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.user-menu')) document.getElementById('userDropdown').classList.remove('open');
});
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('bf_token');
  localStorage.removeItem('bf_userId');
  localStorage.removeItem('bf_username');
  window.location.href = 'login.html';
});

document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    link.classList.add('active');
    const filter = link.dataset.filter;
    let filtered = allItems;
    if (filter === 'Movie') filtered = allItems.filter(i => i.Type === 'Movie');
    if (filter === 'Series') filtered = allItems.filter(i => i.Type === 'Series');
    if (filter === 'favorites') filtered = allItems.filter(i => i.UserData && i.UserData.IsFavorite);
    renderRows(filtered);
  });
});

// ---------- Boot ----------
(async function boot() {
  try {
    allItems = await fetchLibrary();
    if (!allItems.length) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    const featured = allItems[Math.floor(Math.random() * Math.min(allItems.length, 10))];
    setHero(featured);
    renderRows(allItems);
  } catch (err) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').querySelector('h2').textContent = 'مش قادرين نوصل للسيرفر';
    document.getElementById('emptyState').querySelector('p').textContent = 'اتأكد إن Jellyfin شغال وحاول تسجل دخول تاني.';
  }
})();
</script>
