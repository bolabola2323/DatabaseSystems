<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل — Bola Flix</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  body { background: var(--bg-void); }

  .top-nav {
    position: fixed; top: 0; right: 0; left: 0; z-index: 40;
    padding: 20px 5%; display: flex; align-items: center; gap: 18px;
    background: linear-gradient(to bottom, rgba(10,9,12,0.85), transparent);
  }
  .back-circle {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; transition: background .15s ease, transform .15s ease;
  }
  .back-circle:hover { background: rgba(255,255,255,0.18); transform: translateX(4px); }

  /* ---------- Hero ---------- */
  .d-hero {
    position: relative; min-height: 78vh;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .d-hero-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    transform: scale(1.05);
    filter: brightness(0.9);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .d-hero-bg.loaded { opacity: 1; }
  .d-hero::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(to top, var(--bg-void) 4%, rgba(10,9,12,0.25) 45%, rgba(10,9,12,0.15) 100%),
      linear-gradient(to left, rgba(10,9,12,0.1), rgba(10,9,12,0.85) 100%);
  }
  .d-hero-content {
    position: relative; z-index: 3; padding: 0 5% 6%; max-width: 720px;
    animation: dIn .8s cubic-bezier(.16,1,.3,1);
  }
  @keyframes dIn { from { opacity:0; transform: translateY(30px);} to {opacity:1; transform:translateY(0);} }

  .d-logo {
    max-width: 380px; max-height: 140px; margin-bottom: 18px;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.6));
    animation: logoPop .7s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes logoPop { from { opacity:0; transform: scale(.9);} to {opacity:1; transform: scale(1);} }
  .d-title-fallback {
    font-size: clamp(2rem, 4.5vw, 3.4rem); font-weight: 900; margin-bottom: 16px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  .d-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; color: var(--text-muted); font-size: .92rem; }
  .d-meta .rating { color: var(--accent-gold); font-weight: 800; display: flex; align-items: center; gap: 4px; }
  .d-meta .age-tag {
    border: 1px solid var(--border-soft); padding: 2px 9px; border-radius: 4px; font-size: .78rem;
  }
  .d-desc { color: #DAD5DB; font-size: 1rem; line-height: 1.85; margin-bottom: 28px; max-width: 640px; }

  .d-actions { display: flex; gap: 14px; align-items: center; }
  .d-play-btn { font-size: 1.05rem; padding: 15px 38px; }
  .d-play-btn svg { width: 20px; height: 20px; }
  .icon-round-btn {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    transition: background .15s ease, transform .15s ease;
  }
  .icon-round-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.08); }
  .icon-round-btn.active { color: var(--accent-ember); border-color: var(--accent-ember-dim); }

  .d-genres { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .genre-tag {
    background: rgba(255,255,255,0.06); color: var(--text-muted);
    font-size: .8rem; padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border-soft);
  }

  /* ---------- Content sections ---------- */
  .d-body { position: relative; z-index: 2; padding: 50px 5% 70px; }
  .d-section { margin-bottom: 46px; opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .d-section.in-view { opacity: 1; transform: translateY(0); }
  .d-section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 18px; }

  .cast-track {
    display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none;
  }
  .cast-track::-webkit-scrollbar { display: none; }
  .cast-card { flex: 0 0 auto; width: 120px; text-align: center; }
  .cast-photo {
    width: 100px; height: 100px; border-radius: 50%; overflow: hidden;
    background: var(--bg-elevated); margin: 0 auto 10px;
    border: 2px solid transparent; transition: border-color .2s ease, transform .2s ease;
  }
  .cast-card:hover .cast-photo { border-color: var(--accent-ember); transform: scale(1.06); }
  .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cast-name { font-size: .84rem; font-weight: 700; margin-bottom: 2px; }
  .cast-role { font-size: .76rem; color: var(--text-muted); }

  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px; background: var(--bg-surface); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 24px;
  }
  .info-item .label { color: var(--text-muted); font-size: .76rem; margin-bottom: 5px; }
  .info-item .value { font-weight: 700; font-size: .94rem; }

  .row-track {
    display: flex; gap: 12px; overflow-x: auto; padding: 6px 0 20px; scroll-behavior: smooth; scrollbar-width: none;
  }
  .row-track::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: 190px; cursor: pointer; border-radius: 8px; overflow: hidden;
    background: var(--bg-surface); position: relative;
    transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
  }
  .card:hover { transform: scale(1.08) translateY(-6px); box-shadow: 0 20px 36px rgba(0,0,0,0.55); z-index: 5; }
  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 2/3; background: var(--bg-elevated); overflow: hidden; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-rating {
    position: absolute; top: 8px; left: 8px; background: rgba(10,9,12,0.75); backdrop-filter: blur(4px);
    color: var(--accent-gold); font-size: .72rem; font-weight: 800; padding: 3px 7px; border-radius: 4px;
  }
  .card-overlay {
    position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,9,12,0.95) 5%, transparent 55%);
    opacity: 0; transition: opacity .25s ease; display: flex; align-items: flex-end; padding: 10px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay-title { font-size: .8rem; font-weight: 700; }

  .d-skeleton {
    position: fixed; inset: 0; z-index: 60; background: var(--bg-void);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .5s ease;
  }
  .d-skeleton.hide { opacity: 0; pointer-events: none; }
  .d-skeleton .ring { width: 44px; height: 44px; border: 3px solid rgba(232,181,77,0.2); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .d-hero { min-height: 64vh; }
    .d-logo { max-width: 260px; max-height: 100px; }
  }
</style>
</head>
<body>

<div class="d-skeleton" id="skeleton"><div class="ring"></div></div>

<nav class="top-nav">
  <a href="index.html" class="back-circle">→</a>
  <span class="logo">Bola<span class="accent">Flix</span></span>
</nav>

<header class="d-hero">
  <div class="d-hero-bg" id="heroBg"></div>
  <div class="d-hero-content">
    <img class="d-logo" id="dLogo" style="display:none;" alt="">
    <h1 class="d-title-fallback" id="dTitleFallback" style="display:none;"></h1>

    <div class="d-meta" id="dMeta"></div>
    <p class="d-desc" id="dDesc"></p>

    <div class="d-actions">
      <button class="btn btn-primary d-play-btn" id="playBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        شاهد الآن
      </button>
      <button class="icon-round-btn" id="favBtn" title="أضف للمفضلة">♡</button>
    </div>

    <div class="d-genres" id="dGenres"></div>
  </div>
</header>

<main class="d-body">
  <section class="d-section" id="castSection">
    <h2 class="d-section-title">فريق العمل</h2>
    <div class="cast-track" id="castTrack"></div>
  </section>

  <section class="d-section" id="infoSection">
    <h2 class="d-section-title">تفاصيل إضافية</h2>
    <div class="info-grid" id="infoGrid"></div>
  </section>

  <section class="d-section" id="similarSection">
    <h2 class="d-section-title">اقتراحات ليك</h2>
    <div class="row-track" id="similarTrack"></div>
  </section>
</main>

<script>
const server = BF_CONFIG.SERVER_URL;
const token = localStorage.getItem('bf_token');
const userId = localStorage.getItem('bf_userId');
if (!server || !token || !userId) window.location.href = 'login.html';

const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');
if (!itemId) window.location.href = 'index.html';

function imgUrl(id, type='Primary', tag='') {
  return `${server}/Items/${id}/Images/${type}?quality=90${tag ? '&tag='+tag : ''}`;
}
function hasSubtitles(item) {
  const ms = item.MediaSources && item.MediaSources[0];
  return !!(ms && (ms.MediaStreams || []).some(s => s.Type === 'Subtitle'));
}

async function boot() {
  try {
    const res = await fetch(`${server}/Users/${userId}/Items/${itemId}`, { headers: { 'X-Emby-Token': token } });
    const item = await res.json();
    render(item);
    loadSimilar(item);
  } catch (err) {
    document.querySelector('.d-hero-content').innerHTML = '<p>مش قادرين نجيب تفاصيل العمل ده دلوقتي.</p>';
  } finally {
    document.getElementById('skeleton').classList.add('hide');
  }
}

function render(item) {
  document.title = `${item.Name} — Bola Flix`;

  const backdropTag = item.BackdropImageTags && item.BackdropImageTags[0];
  const bgUrl = backdropTag ? imgUrl(item.Id, 'Backdrop', backdropTag) : imgUrl(item.Id);
  const bg = document.getElementById('heroBg');
  const preload = new Image();
  preload.onload = () => bg.classList.add('loaded');
  preload.src = bgUrl;
  bg.style.backgroundImage = `url('${bgUrl}')`;

  // شعار الفيلم (Logo) لو متاح، غير كده اسم الفيلم كنص
  if (item.ImageTags && item.ImageTags.Logo) {
    const logoImg = document.getElementById('dLogo');
    logoImg.src = imgUrl(item.Id, 'Logo', item.ImageTags.Logo);
    logoImg.style.display = 'block';
  } else {
    const fb = document.getElementById('dTitleFallback');
    fb.textContent = item.Name;
    fb.style.display = 'block';
  }

  const runtime = item.RunTimeTicks ? Math.round(item.RunTimeTicks / 600000000) : null;
  document.getElementById('dMeta').innerHTML = `
    ${item.CommunityRating ? `<span class="rating">★ ${item.CommunityRating.toFixed(1)}</span>` : ''}
    <span>${item.ProductionYear || ''}</span>
    ${runtime ? `<span>${runtime} دقيقة</span>` : ''}
    ${item.OfficialRating ? `<span class="age-tag">${item.OfficialRating}</span>` : ''}
    <span>${item.Type === 'Series' ? 'مسلسل' : 'فيلم'}</span>
    ${hasSubtitles(item) ? `<span class="age-tag" style="color:var(--accent-gold);border-color:rgba(232,181,77,0.4);">CC متوفرة</span>` : ''}
  `;

  document.getElementById('dDesc').textContent = item.Overview || 'لا يوجد وصف متاح لهذا العمل حاليًا.';
  document.getElementById('dGenres').innerHTML = (item.Genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('');

  document.getElementById('playBtn').addEventListener('click', () => {
    window.location.href = `player.html?id=${item.Id}`;
  });

  const favBtn = document.getElementById('favBtn');
  favBtn.classList.toggle('active', item.UserData && item.UserData.IsFavorite);
  favBtn.textContent = (item.UserData && item.UserData.IsFavorite) ? '♥' : '♡';
  favBtn.addEventListener('click', async () => {
    const isFav = favBtn.classList.contains('active');
    const method = isFav ? 'DELETE' : 'POST';
    await fetch(`${server}/Users/${userId}/FavoriteItems/${item.Id}`, { method, headers: { 'X-Emby-Token': token } }).catch(() => {});
    favBtn.classList.toggle('active');
    favBtn.textContent = favBtn.classList.contains('active') ? '♥' : '♡';
  });

  // فريق العمل
  const castTrack = document.getElementById('castTrack');
  const people = (item.People || []).filter(p => p.Type === 'Actor').slice(0, 16);
  if (people.length) {
    people.forEach(p => {
      const card = document.createElement('div');
      card.className = 'cast-card';
      const photo = p.PrimaryImageTag ? `${server}/Items/${p.Id}/Images/Primary?tag=${p.PrimaryImageTag}&quality=80` : '';
      card.innerHTML = `
        <div class="cast-photo">${photo ? `<img src="${photo}" alt="${p.Name}" loading="lazy">` : ''}</div>
        <div class="cast-name">${p.Name}</div>
        <div class="cast-role">${p.Role || ''}</div>
      `;
      castTrack.appendChild(card);
    });
  } else {
    document.getElementById('castSection').style.display = 'none';
  }

  // تفاصيل إضافية
  const info = document.getElementById('infoGrid');
  const infoItems = [
    ['المخرج', (item.People || []).find(p => p.Type === 'Director')?.Name],
    ['الاستوديو', (item.Studios || [])[0]?.Name],
    ['اللغة', item.OriginalTitle && item.OriginalTitle !== item.Name ? item.OriginalTitle : null],
    ['تاريخ الإصدار', item.PremiereDate ? new Date(item.PremiereDate).toLocaleDateString('ar-EG') : null],
  ].filter(([,v]) => v);
  if (infoItems.length) {
    info.innerHTML = infoItems.map(([label, value]) => `
      <div class="info-item"><div class="label">${label}</div><div class="value">${value}</div></div>
    `).join('');
  } else {
    document.getElementById('infoSection').style.display = 'none';
  }

  observeSections();
}

async function loadSimilar(item) {
  try {
    const res = await fetch(`${server}/Items/${item.Id}/Similar?userId=${userId}&limit=16`, { headers: { 'X-Emby-Token': token } });
    const data = await res.json();
    const items = data.Items || [];
    const track = document.getElementById('similarTrack');
    if (!items.length) { document.getElementById('similarSection').style.display = 'none'; return; }
    items.forEach(sim => {
      const rating = sim.CommunityRating ? sim.CommunityRating.toFixed(1) : '—';
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${imgUrl(sim.Id)}" alt="${sim.Name}" loading="lazy" onerror="this.style.opacity=0">
          <span class="card-rating">★ ${rating}</span>
          <div class="card-overlay"><span class="card-overlay-title">${sim.Name}</span></div>
        </div>
      `;
      card.addEventListener('click', () => window.location.href = `details.html?id=${sim.Id}`);
      track.appendChild(card);
    });
    observeSections();
  } catch (err) {
    document.getElementById('similarSection').style.display = 'none';
  }
}

function observeSections() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.d-section:not(.in-view)').forEach(s => obs.observe(s));
}

boot();
</script>

</body>
</html>
