<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تشغيل — Bola Flix</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-void); overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ---------- خلفية الصفحة المتوهجة (بوستر الفيلم) ---------- */
  .page-ambient-bg {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(60px) brightness(0.55) saturate(1.3);
    transform: scale(1.2);
    opacity: 0; transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .page-ambient-bg.loaded { opacity: 1; }
  .page-ambient-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(6,5,7,0.5) 0%, var(--bg-void) 88%);
  }

  .top-nav, .watch-wrap { position: relative; z-index: 2; }

  .top-nav {
    padding: 16px 5%; display: flex; align-items: center; gap: 18px;
    position: relative; z-index: 2; flex: 0 0 auto;
  }
  .back-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; transition: background .15s ease, transform .15s ease;
  }
  .back-circle:hover { background: rgba(255,255,255,0.18); transform: translateX(4px); }

  .watch-wrap {
    position: relative; z-index: 2;
    max-width: 1500px; width: 100%; margin: 0 auto; padding: 14px 4% 18px;
    box-sizing: border-box;
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: wIn .7s cubic-bezier(.16,1,.3,1);
  }
  @keyframes wIn { from { opacity:0; transform: translateY(24px);} to {opacity:1; transform:translateY(0);} }

  .video-title-overlay {
    position: absolute; right: 0; left: 0; bottom: 78px; z-index: 8;
    padding: 0 28px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .watch-title-row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .watch-title { font-size: clamp(1.4rem, 2.6vw, 2.2rem); font-weight: 900; }
  .cc-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(232,181,77,0.12); border: 1px solid rgba(232,181,77,0.4);
    color: var(--accent-gold); font-size: .74rem; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
  }
  .watch-meta { color: #ddd; font-size: .88rem; display: flex; gap: 12px; }
  .watch-meta .rating { color: var(--accent-gold); font-weight: 700; }

  /* ---------- صندوق الفيديو: بياخد المساحة المتاحة كلها بدون ما يعمل اسكرول ---------- */
  .video-box {
    position: relative; width: 100%; aspect-ratio: 16/9; max-height: 100%; flex: 0 0 auto;
    border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 40px 90px rgba(0,0,0,0.65), 0 0 0 1px var(--border-soft);
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  video::cue {
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 1.05em;
    padding: 2px 4px;
  }

  /* ---------- شاشة التحميل داخل الصندوق ---------- */
  .loading-stage {
    position: absolute; inset: 0; z-index: 12;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    transition: opacity .8s ease, visibility .8s ease;
  }
  .loading-stage.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: brightness(0.4) blur(2px); transform: scale(1.08);
    opacity: 0; transition: opacity 1s ease;
  }
  .loading-bg.loaded { opacity: 1; }
  .loading-bg::after { content:''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.7) 92%); }
  .loading-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .loading-logo {
    max-width: 240px; max-height: 100px;
    filter: drop-shadow(0 0 24px rgba(0,0,0,0.6));
    animation: logoPulse 1.6s ease-in-out infinite;
  }
  @keyframes logoPulse { 0%,100% { opacity:.55; transform: scale(.97);} 50% { opacity:1; transform: scale(1.03);} }
  .loading-title-fallback { font-size: 1.2rem; font-weight: 900; color: #fff; animation: logoPulse 1.6s ease-in-out infinite; }
  .loading-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.14); border-radius: 3px; overflow: hidden; }
  .loading-bar-fill { height: 100%; width: 30%; background: var(--accent-gold); border-radius: 3px; animation: barSlide 1.3s ease-in-out infinite; }
  @keyframes barSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }

  /* ---------- اختيار الاستكمال ---------- */
  .resume-box {
    position: absolute; inset: 0; z-index: 15;
    background: rgba(6,5,7,0.88); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; text-align: center; padding: 20px;
  }
  .resume-box.show { display: flex; }
  .resume-box.flash { animation: resumeFlash 1.1s ease; }
  @keyframes resumeFlash {
    0% { box-shadow: inset 0 0 0 3px rgba(232,181,77,0); }
    30% { box-shadow: inset 0 0 0 3px rgba(232,181,77,0.9); }
    100% { box-shadow: inset 0 0 0 3px rgba(232,181,77,0); }
  }
  .resume-box h3 { font-size: 1.15rem; font-weight: 800; }
  .resume-box p { color: var(--text-muted); font-size: .86rem; }
  .resume-actions { display: flex; gap: 12px; }
  .resume-actions button {
    padding: 12px 26px; border-radius: 6px; font-weight: 700; font-size: .9rem;
    transition: transform .15s ease;
  }
  .resume-actions button:hover { transform: translateY(-2px); }
  .btn-resume { background: var(--accent-ember); color: #fff; }
  .btn-restart { background: rgba(255,255,255,0.1); color: #fff; }

  /* ---------- شريط تحكم مخصص ---------- */
  .controls-bar {
    position: absolute; right: 0; left: 0; bottom: 0; z-index: 10;
    padding: 34px 18px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    opacity: 1; transition: opacity .35s ease;
  }
  .controls-bar.hidden { opacity: 0; pointer-events: none; }
  .progress-track {
    position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.22);
    cursor: pointer; margin-bottom: 14px;
  }
  .progress-fill { position: absolute; inset: 0; width: 0%; background: var(--accent-ember); border-radius: 3px; }
  .progress-buffer { position: absolute; inset: 0; width: 0%; background: rgba(255,255,255,0.25); border-radius: 3px; }
  .controls-row { display: flex; align-items: center; gap: 14px; }
  .ctrl-btn {
    background: none; color: #fff; font-size: 1.15rem; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    transition: background .15s ease;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.14); }
  .ctrl-btn.active { color: var(--accent-gold); }
  .time-text { color: #ddd; font-size: .82rem; min-width: 90px; }
  .spacer { flex: 1; }

  .volume-slider {
    -webkit-appearance: none; appearance: none;
    width: 90px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.25); cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; cursor: pointer;
  }
  .volume-slider::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: none; cursor: pointer;
  }

  .subtitle-menu-wrap { position: relative; }
  .subtitle-menu {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    min-width: 180px;
    background: var(--bg-surface, #17141a); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    display: none; flex-direction: column; gap: 2px;
    z-index: 25;
  }
  .subtitle-menu.open { display: flex; }
  .subtitle-menu-item {
    background: none; color: #fff; font-size: .84rem; text-align: right;
    padding: 9px 12px; border-radius: 6px; width: 100%;
  }
  .subtitle-menu-item:hover { background: rgba(255,255,255,0.08); }
  .subtitle-menu-item.active { color: var(--accent-gold); font-weight: 700; }
  .subtitle-menu-title {
    font-size: .7rem; color: var(--text-muted); padding: 6px 12px 2px;
  }

  .err-box {
    position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #000; text-align: center; padding: 20px;
  }
  .err-box.show { display: flex; }

  @media (max-width: 720px) {
    .watch-title { font-size: 1.2rem; }
    .loading-logo { max-width: 160px; }
    .watch-wrap { padding: 0 3%; margin-top: 14px; }
    .video-title-overlay { bottom: 58px; padding: 0 16px; }
  }
</style>
</head>
<body>

<div class="projector-beam"></div>
<div class="film-grain"></div>

<div class="page-ambient-bg" id="pageAmbientBg"></div>

<nav class="top-nav">
  <a href="javascript:history.back()" class="back-circle">→</a>
  <span class="logo">Bola<span class="accent">Flix</span></span>
</nav>

<div class="watch-wrap">
  <div class="video-box" id="videoBox">
    <div class="video-title-overlay">
      <div class="watch-title-row">
        <h1 class="watch-title" id="watchTitle">جاري التحميل...</h1>
        <span class="cc-badge" id="ccBadge" style="display:none;">CC · متوفر ترجمة</span>
      </div>
      <div class="watch-meta" id="watchMeta"></div>
    </div>

    <div class="loading-stage" id="loadingStage">
      <div class="loading-bg" id="loadingBg"></div>
      <div class="loading-center">
        <img class="loading-logo" id="loadingLogo" style="display:none;" alt="">
        <div class="loading-title-fallback" id="loadingTitleFallback" style="display:none;"></div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      </div>
    </div>

    <div class="resume-box" id="resumeBox">
      <h3>عايز تكمل ولا تبدأ من الأول؟</h3>
      <p id="resumeTime"></p>
      <div class="resume-actions">
        <button class="btn-resume" id="resumeBtn">أكمل من هنا</button>
        <button class="btn-restart" id="restartBtn">ابدأ من الأول</button>
      </div>
    </div>

    <div class="err-box" id="errBox">
      <p style="font-size:1.05rem;font-weight:700;color:#fff;">مش قادرين نشغّل الفيديو ده دلوقتي</p>
      <p style="color:var(--text-muted);font-size:.86rem;">اتأكد إن السيرفر شغال أو جرب فيلم تاني</p>
      <a href="index.html" class="btn btn-ghost">رجوع للمكتبة</a>
    </div>

    <video id="video" playsinline></video>

    <div class="controls-bar" id="controlsBar">
      <div class="progress-track" id="progressTrack">
        <div class="progress-buffer" id="progressBuffer"></div>
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="controls-row">
        <button class="ctrl-btn" id="playPauseBtn">▶</button>
        <button class="ctrl-btn" id="muteBtn">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        <span class="time-text" id="timeText">00:00 / 00:00</span>
        <span class="spacer"></span>
        <div class="subtitle-menu-wrap">
          <div class="subtitle-menu" id="subtitleMenu"></div>
          <button class="ctrl-btn" id="ccBtn" style="display:none;">CC</button>
        </div>
        <button class="ctrl-btn" id="fullscreenBtn">⛶</button>
      </div>
    </div>
  </div>
</div>

<script>
const server = BF_CONFIG.SERVER_URL;
const token = localStorage.getItem('bf_token');
const userId = localStorage.getItem('bf_userId');
if (!server || !token) window.location.href = 'login.html';

const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');

const video = document.getElementById('video');
const videoBox = document.getElementById('videoBox');
const loadingStage = document.getElementById('loadingStage');
const loadingBg = document.getElementById('loadingBg');
const pageAmbientBg = document.getElementById('pageAmbientBg');
const errBox = document.getElementById('errBox');
const resumeBox = document.getElementById('resumeBox');
const controlsBar = document.getElementById('controlsBar');

if (!itemId) { errBox.classList.add('show'); loadingStage.classList.add('hide'); }
else init();

function imgUrl(id, type='Primary', tag='') {
  return `${server}/Items/${id}/Images/${type}?quality=90${tag ? '&tag='+tag : ''}`;
}
function fmtTime(sec) {
  if (!isFinite(sec)) return '00:00';
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

let resumeTicks = 0;
let subtitleStreams = [];

async function init() {
  try {
    const res = await fetch(`${server}/Users/${userId}/Items/${itemId}`, { headers: { 'X-Emby-Token': token } });
    const item = await res.json();

    document.getElementById('watchTitle').textContent = item.Name || '';
    document.title = `${item.Name} — Bola Flix`;

    const runtime = item.RunTimeTicks ? Math.round(item.RunTimeTicks / 600000000) : null;
    document.getElementById('watchMeta').innerHTML = `
      ${item.CommunityRating ? `<span class="rating">★ ${item.CommunityRating.toFixed(1)}</span>` : ''}
      <span>${item.ProductionYear || ''}</span>
      ${runtime ? `<span>${runtime} دقيقة</span>` : ''}
    `;

    // خلفية التحميل + شعار الفيلم
    const backdropTag = item.BackdropImageTags && item.BackdropImageTags[0];
    const bgUrl = backdropTag ? imgUrl(item.Id, 'Backdrop', backdropTag) : imgUrl(item.Id);
    const preload = new Image();
    preload.onload = () => { loadingBg.classList.add('loaded'); pageAmbientBg.classList.add('loaded'); };
    preload.src = bgUrl;
    loadingBg.style.backgroundImage = `url('${bgUrl}')`;
    pageAmbientBg.style.backgroundImage = `url('${bgUrl}')`;

    if (item.ImageTags && item.ImageTags.Logo) {
      const logo = document.getElementById('loadingLogo');
      logo.src = imgUrl(item.Id, 'Logo', item.ImageTags.Logo);
      logo.style.display = 'block';
    } else {
      const fb = document.getElementById('loadingTitleFallback');
      fb.textContent = item.Name;
      fb.style.display = 'block';
    }

    // الترجمة: نجيبها من MediaStreams لو متاحة
    const mediaSource = item.MediaSources && item.MediaSources[0];
    subtitleStreams = mediaSource ? (mediaSource.MediaStreams || []).filter(s => s.Type === 'Subtitle') : [];
    if (subtitleStreams.length) {
      document.getElementById('ccBadge').style.display = 'inline-flex';
      document.getElementById('ccBtn').style.display = 'flex';
      subtitleStreams.forEach((s, idx) => {
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = s.DisplayTitle || s.Language || `ترجمة ${idx+1}`;
        track.srclang = s.Language || 'ar';
        track.src = `${server}/Videos/${itemId}/${mediaSource.Id}/Subtitles/${s.Index}/Stream.vtt?api_key=${token}`;
        video.appendChild(track);
      });
      buildSubtitleMenu();
    }

    const streamUrl = `${server}/Videos/${itemId}/stream?static=true&api_key=${token}`;
    video.src = streamUrl;
    video.load();

    // استكمال المشاهدة
    resumeTicks = (item.UserData && item.UserData.PlaybackPositionTicks) || 0;
    if (resumeTicks > 0 && !(item.UserData && item.UserData.Played)) {
      document.getElementById('resumeTime').textContent = `وقفت عند ${fmtTime(resumeTicks / 10000000)}`;
    }

    video.addEventListener('canplay', onReady, { once: true });
    video.addEventListener('error', () => {
      loadingStage.classList.add('hide');
      errBox.classList.add('show');
    });

    video.addEventListener('timeupdate', () => {
      updateProgressUI();
      if (Math.floor(video.currentTime) % 10 === 0) reportProgress();
    });
    video.addEventListener('ended', () => reportStopped());
    window.addEventListener('beforeunload', () => reportStopped());

  } catch (err) {
    loadingStage.classList.add('hide');
    errBox.classList.add('show');
  }
}

function onReady() {
  loadingStage.classList.add('hide');
  if (resumeTicks > 0) {
    resumeBox.classList.add('show');
    // الوميض بيحصل مرة واحدة بس لحظة ما الفيلم يفتح
    requestAnimationFrame(() => {
      resumeBox.classList.add('flash');
      setTimeout(() => resumeBox.classList.remove('flash'), 1200);
    });
  } else {
    video.play().catch(() => {});
  }
}

document.getElementById('resumeBtn').addEventListener('click', () => {
  video.currentTime = resumeTicks / 10000000;
  resumeBox.classList.remove('show');
  video.play().catch(() => {});
});
document.getElementById('restartBtn').addEventListener('click', () => {
  video.currentTime = 0;
  resumeBox.classList.remove('show');
  video.play().catch(() => {});
});

// ---------- أزرار التحكم المخصصة ----------
const playPauseBtn = document.getElementById('playPauseBtn');
const muteBtn = document.getElementById('muteBtn');
const volumeSlider = document.getElementById('volumeSlider');
const ccBtn = document.getElementById('ccBtn');
const subtitleMenu = document.getElementById('subtitleMenu');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const timeText = document.getElementById('timeText');

playPauseBtn.addEventListener('click', () => { video.paused ? video.play() : video.pause(); });
video.addEventListener('play', () => playPauseBtn.textContent = '❚❚');
video.addEventListener('pause', () => playPauseBtn.textContent = '▶');

// ---------- الصوت: زرار كتم + شريط تحكم بمستوى الصوت ----------
function updateVolumeIcon() {
  if (video.muted || video.volume === 0) muteBtn.textContent = '🔇';
  else if (video.volume < 0.5) muteBtn.textContent = '🔉';
  else muteBtn.textContent = '🔊';
}
muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) { video.volume = 0.5; volumeSlider.value = 0.5; }
  updateVolumeIcon();
});
volumeSlider.addEventListener('input', () => {
  video.volume = parseFloat(volumeSlider.value);
  video.muted = video.volume === 0;
  updateVolumeIcon();
});
video.volume = 1;
updateVolumeIcon();

// ---------- الترجمة: قائمة اختيار حقيقية بدل تشغيل/إيقاف أعمى ----------
function buildSubtitleMenu() {
  let html = `<div class="subtitle-menu-title">الترجمة</div>`;
  html += `<button class="subtitle-menu-item active" data-track="-1">بدون ترجمة</button>`;
  subtitleStreams.forEach((s, idx) => {
    const label = s.DisplayTitle || s.Language || `ترجمة ${idx+1}`;
    html += `<button class="subtitle-menu-item" data-track="${idx}">${label}</button>`;
  });
  subtitleMenu.innerHTML = html;
  subtitleMenu.querySelectorAll('.subtitle-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const chosen = parseInt(btn.dataset.track, 10);
      for (let i = 0; i < video.textTracks.length; i++) {
        video.textTracks[i].mode = (i === chosen) ? 'showing' : 'hidden';
      }
      subtitleMenu.querySelectorAll('.subtitle-menu-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ccBtn.classList.toggle('active', chosen !== -1);
      subtitleMenu.classList.remove('open');
    });
  });
}
ccBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  subtitleMenu.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.subtitle-menu-wrap')) subtitleMenu.classList.remove('open');
});

fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) videoBox.requestFullscreen?.();
  else document.exitFullscreen?.();
});

progressTrack.addEventListener('click', (e) => {
  const rect = progressTrack.getBoundingClientRect();
  const ratio = 1 - (e.clientX - rect.left) / rect.width; // RTL
  if (video.duration) video.currentTime = ratio * video.duration;
});

function updateProgressUI() {
  if (!video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = `${pct}%`;
  timeText.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
}

let hideTimer;
function resetControls() {
  controlsBar.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!video.paused) controlsBar.classList.add('hidden'); }, 3200);
}
videoBox.addEventListener('mousemove', resetControls);
video.addEventListener('play', resetControls);
resetControls();

// ---------- تتبع التقدم ----------
function reportProgress() {
  fetch(`${server}/Sessions/Playing/Progress`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Emby-Token': token },
    body: JSON.stringify({ ItemId: itemId, PositionTicks: Math.floor(video.currentTime * 10000000) })
  }).catch(() => {});
}
function reportStopped() {
  navigator.sendBeacon?.(`${server}/Sessions/Playing/Stopped`, JSON.stringify({
    ItemId: itemId, PositionTicks: Math.floor(video.currentTime * 10000000)
  }));
}
</script>

</body>
</html>
