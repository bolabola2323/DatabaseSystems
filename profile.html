<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البروفايل — Bola Flix</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .top-nav {
    position: fixed; top: 0; right: 0; left: 0; z-index: 40;
    padding: 18px 5%; display: flex; align-items: center; gap: 18px;
    background: rgba(10,9,12,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
  }
  .back-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; transition: background .15s ease, transform .15s ease;
  }
  .back-circle:hover { background: rgba(255,255,255,0.18); transform: translateX(4px); }

  .profile-header {
    position: relative; padding: 130px 5% 40px;
    display: flex; align-items: center; gap: 22px;
    animation: pIn .6s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pIn { from { opacity:0; transform: translateY(20px);} to {opacity:1; transform:translateY(0);} }
  .profile-avatar {
    width: 84px; height: 84px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent-ember), var(--accent-gold));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2rem; color: #1a0a10;
    box-shadow: 0 10px 30px rgba(200,29,77,0.3);
  }
  .profile-name { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
  .profile-sub { color: var(--text-muted); font-size: .9rem; }

  .stats-row { display: flex; gap: 14px; padding: 0 5% 40px; flex-wrap: wrap; }
  .stat-card {
    background: var(--bg-surface); border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 20px 26px; min-width: 150px;
    opacity: 0; transform: translateY(16px);
    animation: statIn .5s cubic-bezier(.16,1,.3,1) forwards;
  }
  .stat-card:nth-child(1) { animation-delay: .05s; }
  .stat-card:nth-child(2) { animation-delay: .15s; }
  .stat-card:nth-child(3) { animation-delay: .25s; }
  @keyframes statIn { to { opacity:1; transform: translateY(0); } }
  .stat-value { font-size: 1.9rem; font-weight: 900; color: var(--accent-gold); }
  .stat-label { color: var(--text-muted); font-size: .84rem; margin-top: 4px; }

  .p-section { padding: 0 5% 46px; opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .p-section.in-view { opacity: 1; transform: translateY(0); }
  .p-section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 16px; }

  .row-track { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
  .row-track::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 auto; width: 190px; cursor: pointer; border-radius: 10px; overflow: hidden;
    background: var(--bg-surface); position: relative;
    transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s ease;
  }
  .card:hover { transform: scale(1.1) translateY(-8px); box-shadow: 0 24px 44px rgba(0,0,0,0.6); z-index: 5; }
  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 2/3; background: var(--bg-elevated); overflow: hidden; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-rating {
    position: absolute; top: 8px; left: 8px; background: rgba(10,9,12,0.75); backdrop-filter: blur(4px);
    color: var(--accent-gold); font-size: .72rem; font-weight: 800; padding: 3px 7px; border-radius: 4px;
  }
  .card-overlay {
    position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,5,7,0.96) 5%, transparent 60%);
    opacity: 0; transition: opacity .3s ease; display: flex; align-items: flex-end; padding: 10px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay-title { font-size: .8rem; font-weight: 800; }
  .card-progress { position: absolute; bottom: 0; right: 0; left: 0; height: 4px; background: rgba(255,255,255,0.15); z-index: 3; }
  .card-progress-fill { height: 100%; background: var(--accent-ember); }
  .played-badge {
    position: absolute; top: 8px; right: 8px; background: rgba(10,9,12,0.75); color: var(--accent-gold);
    width: 22px; height: 22px; border-radius: 50%; font-size: .72rem; display: flex; align-items: center; justify-content: center;
  }

  .p-empty { color: var(--text-muted); font-size: .9rem; padding: 20px 0; }
</style>
</head>
<body>

<div class="projector-beam"></div>
<div class="film-grain"></div>

<nav class="top-nav">
  <a href="index.html" class="back-circle">→</a>
  <span class="logo">Bola<span class="accent">Flix</span></span>
</nav>

<div class="profile-header">
  <div class="profile-avatar" id="pAvatar">?</div>
  <div>
    <div class="profile-name" id="pName">...</div>
    <div class="profile-sub">حسابك على Bola Flix</div>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card"><div class="stat-value" id="statWatched">0</div><div class="stat-label">عمل اتفرجت عليه بالكامل</div></div>
  <div class="stat-card"><div class="stat-value" id="statProgress">0</div><div class="stat-label">لسه بتكمله</div></div>
  <div class="stat-card"><div class="stat-value" id="statFav">0</div><div class="stat-label">في المفضلة</div></div>
</div>

<section class="p-section" id="cwSection">
  <h2 class="p-section-title">أكمل المشاهدة</h2>
  <div class="row-track" id="cwTrack"></div>
</section>

<section class="p-section" id="historySection">
  <h2 class="p-section-title">شاهدتها قبل كده</h2>
  <div class="row-track" id="historyTrack"></div>
</section>

<script>
const server = BF_CONFIG.SERVER_URL;
const token = localStorage.getItem('bf_token');
const userId = localStorage.getItem('bf_userId');
const username = localStorage.getItem('bf_username');
if (!server || !token || !userId) window.location.href = 'login.html';

document.getElementById('pName').textContent = username || '';
document.getElementById('pAvatar').textContent = (username || '?').trim().charAt(0).toUpperCase();

function imgUrl(id, type='Primary', tag='') {
  return `${server}/Items/${id}/Images/${type}?quality=90${tag ? '&tag='+tag : ''}`;
}

function buildCard(item, { showProgress = false, showPlayed = false } = {}) {
  const el = document.createElement('div');
  el.className = 'card';
  const rating = item.CommunityRating ? item.CommunityRating.toFixed(1) : '—';

  let progressBar = '';
  if (showProgress && item.UserData && item.UserData.PlaybackPositionTicks && item.RunTimeTicks) {
    const pct = Math.min(100, Math.round((item.UserData.PlaybackPositionTicks / item.RunTimeTicks) * 100));
    progressBar = `<div class="card-progress"><div class="card-progress-fill" style="width:${pct}%"></div></div>`;
  }
  const playedBadge = (showPlayed && item.UserData && item.UserData.Played) ? `<div class="played-badge">✓</div>` : '';

  el.innerHTML = `
    <div class="card-img-wrap">
      <img src="${imgUrl(item.Id)}" alt="${item.Name}" loading="lazy" onerror="this.style.opacity=0">
      <span class="card-rating">★ ${rating}</span>
      ${playedBadge}
      <div class="card-overlay"><span class="card-overlay-title">${item.Name}</span></div>
      ${progressBar}
    </div>
  `;
  el.addEventListener('click', () => window.location.href = `details.html?id=${item.Id}`);
  return el;
}

function observeSections() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); obs.unobserve(e.target); } });
  }, { threshold: 0.08 });
  document.querySelectorAll('.p-section:not(.in-view)').forEach(s => obs.observe(s));
}

async function fetchItems(filters, extra='') {
  const url = `${server}/Users/${userId}/Items?Recursive=true&IncludeItemTypes=Movie,Series&Fields=UserData,RunTimeTicks,CommunityRating${extra}${filters ? '&Filters='+filters : ''}`;
  const res = await fetch(url, { headers: { 'X-Emby-Token': token } });
  const data = await res.json();
  return data.Items || [];
}

async function boot() {
  try {
    const [continueWatching, history, favorites] = await Promise.all([
      fetchItems('IsResumable', '&SortBy=DatePlayed&SortOrder=Descending&Limit=20'),
      fetchItems('IsPlayed', '&SortBy=DatePlayed&SortOrder=Descending&Limit=30'),
      fetchItems('IsFavorite', '&Limit=1')
    ]);

    document.getElementById('statWatched').textContent = history.length;
    document.getElementById('statProgress').textContent = continueWatching.length;

    // عدد المفضلة الحقيقي (طلب منفصل بدون Limit)
    fetchItems('IsFavorite', '').then(favs => {
      document.getElementById('statFav').textContent = favs.length;
    });

    const cwTrack = document.getElementById('cwTrack');
    if (continueWatching.length) {
      continueWatching.forEach(item => cwTrack.appendChild(buildCard(item, { showProgress: true })));
    } else {
      document.getElementById('cwSection').innerHTML = '<h2 class="p-section-title">أكمل المشاهدة</h2><p class="p-empty">لسه معملتش تكمل مشاهدة أي فيلم.</p>';
    }

    const historyTrack = document.getElementById('historyTrack');
    if (history.length) {
      history.forEach(item => historyTrack.appendChild(buildCard(item, { showPlayed: true })));
    } else {
      document.getElementById('historySection').innerHTML = '<h2 class="p-section-title">شاهدتها قبل كده</h2><p class="p-empty">لسه معملتش تشاهد أي فيلم بالكامل.</p>';
    }

    observeSections();
  } catch (err) {
    document.querySelector('.stats-row').insertAdjacentHTML('afterend', '<p class="p-empty" style="padding:0 5%;">مش قادرين نجيب بيانات البروفايل دلوقتي.</p>');
  }
}

boot();
</script>

</body>
</html>
