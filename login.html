<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — Bola Flix</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(200,29,77,0.18), transparent 55%),
      var(--bg-void);
  }

  .top-bar {
    position: fixed;
    top: 0; right: 0; left: 0;
    padding: 24px 5%;
    z-index: 5;
  }

  .auth-card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 420px;
    margin: 90px 20px 40px;
    background: rgba(22,20,26,0.86);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 44px 38px 38px;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-deep);
    animation: cardRise .6s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(28px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-card h1 {
    font-size: 1.65rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .auth-card .sub {
    color: var(--text-muted);
    font-size: .92rem;
    margin-bottom: 28px;
  }

  .field {
    position: relative;
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: .82rem;
    color: var(--text-muted);
    margin-bottom: 7px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    padding: 13px 15px;
    border-radius: 7px;
    font-size: .95rem;
    font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent-ember);
    box-shadow: 0 0 0 3px rgba(200,29,77,0.18);
  }
  .field small {
    display: block;
    margin-top: 6px;
    color: var(--text-muted);
    font-size: .74rem;
  }

  .toggle-server {
    background: none;
    color: var(--accent-gold);
    font-size: .78rem;
    padding: 0;
    margin: -8px 0 18px;
    display: inline-block;
  }
  .server-field { display: none; }
  .server-field.open { display: block; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    margin-top: 6px;
  }
  .submit-btn[disabled] { opacity: .6; pointer-events: none; }

  .error-msg {
    display: none;
    background: rgba(200,29,77,0.12);
    border: 1px solid var(--accent-ember-dim);
    color: #FF9EB4;
    padding: 11px 14px;
    border-radius: 7px;
    font-size: .85rem;
    margin-bottom: 16px;
  }
  .error-msg.show { display: block; animation: shake .35s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot-note {
    text-align: center;
    margin-top: 22px;
    font-size: .82rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="projector-beam"></div>
<div class="film-grain"></div>

<div class="top-bar">
  <span class="logo">Bola<span class="accent">Flix</span></span>
</div>

<form class="auth-card" id="loginForm" autocomplete="off">
  <h1>أهلاً بيك تاني</h1>
  <p class="sub">سجّل دخولك بحساب السيرفر بتاعك عشان تكمل المشاهدة</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" placeholder="اسم المستخدم" required>
  </div>

  <div class="field">
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••" required>
  </div>

  <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
    <span class="spinner" id="spinner"></span>
    <span id="btnText">تسجيل الدخول</span>
  </button>

  <p class="foot-note">Bola Flix — منصتك، مكتبتك، بلا حدود</p>
</form>

<script>
const server = BF_CONFIG.SERVER_URL;

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');
const spinner = document.getElementById('spinner');
const btnText = document.getElementById('btnText');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}
function hideError() { errorMsg.classList.remove('show'); }

function setLoading(loading) {
  submitBtn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
  btnText.textContent = loading ? 'جاري التحقق...' : 'تسجيل الدخول';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  setLoading(true);

  try {
    const res = await fetch(`${server}/Users/AuthenticateByName`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': 'MediaBrowser Client="BolaFlix", Device="Web", DeviceId="bolaflix-web", Version="1.0.0"'
      },
      body: JSON.stringify({ Username: username, Pw: password })
    });

    if (!res.ok) {
      throw new Error(res.status === 401 ? 'اسم المستخدم أو كلمة المرور غلط.' : 'السيرفر رفض الاتصال. اتأكد من العنوان.');
    }

    const data = await res.json();

    localStorage.setItem('bf_token', data.AccessToken);
    localStorage.setItem('bf_userId', data.User.Id);
    localStorage.setItem('bf_username', data.User.Name);

    btnText.textContent = 'تمام، بنجهزلك المكتبة...';
    window.location.href = 'index.html';

  } catch (err) {
    setLoading(false);
    showError(err.message || 'مش قادرين نوصل للسيرفر دلوقتي، جرب تاني.');
  }
});
</script>

</body>
</html>
